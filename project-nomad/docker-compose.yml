version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: nomad_admin
      APP_PORT: 8080

  admin:
    image: ghcr.io/crosstalk-solutions/project-nomad:latest
    container_name: nomad_admin
    restart: unless-stopped
    pull_policy: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - nomad-update-shared:/app/update-shared
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      URL: http://${DEVICE_DOMAIN_NAME}/project-nomad
      APP_KEY: 7f0e9b7c4b6d8a3f2c1e9d5a8b0f6c4d
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: nomad
      DB_USER: nomad_user
      DB_PASSWORD: 6bN9qF2xL8vR4mT7pZ3cW5sY
      DB_NAME: nomad
      DB_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: info
      DISABLE_COMPRESSION: "false"
    depends_on:
      - mysql
      - redis

  mysql:
    image: mysql:8.0
    container_name: nomad_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: M8zQ2rV7xL5pN9cT4wY6sK3d
      MYSQL_DATABASE: nomad
      MYSQL_USER: nomad_user
      MYSQL_PASSWORD: 6bN9qF2xL8vR4mT7pZ3cW5sY
    volumes:
      - ${APP_DATA_DIR}/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nomad_redis
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  dozzle:
    image: amir20/dozzle:v10.0
    container_name: nomad_dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"

volumes:
  nomad-update-shared:

networks:
  default:
    name: project-nomad_default
