version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ranciid-bindery_server_1
      APP_PORT: 8787
      # Bindery manages its own accounts, including first-run admin setup.
      PROXY_AUTH_ADD: "false"

  # Umbrel/Docker can create bind-mount folders as root:root (mode 0755).
  # Bindery runs as 1000:1000 and cannot initialize its SQLite database there.
  # This one-time setup fixes ONLY Bindery's private config and the two library
  # root directories, not the existing contents of shared Downloads.
  init_perms:
    image: alpine:3.22.1@sha256:4bcff63911fcb4448bd4fdacec207030997caf25e9bea4045fa6c8c44de311d1
    user: "0:0"
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mkdir -p /config /downloads/books /downloads/audiobooks
        chown -R 1000:1000 /config
        chown 1000:1000 /downloads/books /downloads/audiobooks
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads

  server:
    image: ghcr.io/ranciid/bindery-kindle:1.52.0-kindle.2
    restart: unless-stopped
    init: true
    user: "1000:1000"
    depends_on:
      init_perms:
        condition: service_completed_successfully
    stop_grace_period: 1m
    environment:
      BINDERY_PORT: "8787"
      BINDERY_PUID: "1000"
      BINDERY_PGID: "1000"
      BINDERY_DATA_DIR: /config
      BINDERY_DB_PATH: /config/bindery.db
      BINDERY_LIBRARY_DIR: /downloads/books
      BINDERY_AUDIOBOOK_DIR: /downloads/audiobooks
      BINDERY_DOWNLOAD_DIR: /downloads
      BINDERY_LOG_LEVEL: info
      # Kindle SMTP credentials are entered securely in Settings → Kindle.
      # No SMTP secrets belong in Docker Compose or this public GitHub repo.
    volumes:
      # Private SQLite database, cache, and backups.
      - ${APP_DATA_DIR}/data/config:/config
      # The same shared path used by Umbrel Prowlarr, SABnzbd, and Audiobookshelf.
      # One mount for downloads + libraries enables hardlinks on the same filesystem.
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    # Direct LAN/OPDS access in addition to the native Umbrel app tile.
    # Do not forward this port to the public internet.
    ports:
      - "8787:8787"
    networks:
      - default
      - umbrel_main_network

networks:
  umbrel_main_network:
    external: true
