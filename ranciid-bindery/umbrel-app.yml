releaseNotes: >-
  Native Kindle edition 1.52.5 adds a recipient picker for Send to Kindle.
  Choose one or more configured Kindle addresses for each manual delivery.
  An existing send attempt for one Kindle no longer blocks a different one.
  Automatic sending remains unchanged. Existing database and storage persist.
