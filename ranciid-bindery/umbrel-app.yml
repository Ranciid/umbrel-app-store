releaseNotes: >-
  Initial Umbrel community package for Bindery v1.52.0 with native app proxy,
  a persistent configuration volume, shared ebook/audiobook libraries,
  and connectivity to existing Prowlarr and SABnzbd services.
submitter: Ranciid
