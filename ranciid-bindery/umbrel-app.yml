releaseNotes: >-
  Ranciid Kindle edition 1.52.2 adds built-in Send to Kindle, authenticated SMTP,
  optional auto-send of newly imported ebooks, and a durable delivery history.
  Existing app data and first-run permissions handling are retained.
submitter: Ranciid
