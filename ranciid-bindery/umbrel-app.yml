manifestVersion: 1.1
id: ranciid-bindery
name: Bindery + Kindle
tagline: Book automation with native Send to Kindle
category: media
version: "1.52.5"
icon: https://raw.githubusercontent.com/Ranciid/umbrel-app-store/main/ranciid-bindery/icon.svg
description: >-
  Bindery is a self-hosted ebook and audiobook manager and a modern alternative
  to Readarr. Follow authors, track missing titles, search supported Newznab
  and Torznab indexers, automate downloads, validate and organize files,
  manage household requests, and integrate with Calibre and Audiobookshelf.


  This Kindle edition adds native Send to Kindle through SMTP2GO or another
  TLS-enabled SMTP provider. Manually select one or more Kindle addresses
  from a device picker, or enable optional automatic delivery of newly
  imported EPUB/PDF files. Sending history and duplicate prevention are
  built directly into Bindery. Automatic Kindle sending is disabled until
  configured by the administrator.

  This Umbrel package integrates with your existing Prowlarr and SABnzbd
  installations without installing duplicate services. Ebook files are stored
  in shared Downloads/books and audiobooks in Downloads/audiobooks, accessible
  to other Umbrel media apps. On first launch, create your Bindery admin
  account, then connect your indexers and download client under Settings.

  Supports ebook and audiobook monitoring, metadata providers, OPDS access,
  a built-in request system, and persistent backups of its local database.
developer: vavallee and contributors; Kindle extension by Ranciid
website: https://github.com/vavallee/bindery
repo: https://github.com/Ranciid/umbrel-app-store
support: https://github.com/vavallee/bindery/issues
port: 8787
path: ""
